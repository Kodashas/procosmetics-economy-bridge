name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - run: mvn -B clean package

      - name: Self-checks
        run: bash scripts/check.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ProCosmeticsEconomyBridge
          path: target/ProCosmeticsEconomyBridge-*.jar

      # The release asset is built here, from the tagged commit, so it can never drift from the
      # source the tag points at.
      - name: Attach the jar to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" target/ProCosmeticsEconomyBridge-*.jar --clobber
