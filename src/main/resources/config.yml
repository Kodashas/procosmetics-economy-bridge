# Id of the ExcellentEconomy currency that ProCosmetics purchases are charged against.
# Must match a currency configured in ExcellentEconomy.
currency-id: coins

# How the currency is named inside messages, in whatever grammatical form your
# language needs. Used for the <currency> placeholder.
currency-name: coins

# Sent after a successful purchase. MiniMessage format.
# Placeholders: <amount>, <currency>
purchase-success-message: <green>Paid <yellow><amount> <currency></yellow><green>.</green>

# Logs every balance operation at INFO. Leave off in production.
debug: false
